<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedição em Fluxo - Login</title>
    <style>
        /* Variáveis de cores e espaçamento para facilidade de personalização */
        :root {
            --dark-blue: #004b87;
            --light-gray-border: #d1d5db;
            --placeholder-gray: #6b7280;
            --background-blue: #eef1f6;
            --shadow: 0 8px 30px rgba(0,0,0,0.1);
            --font-family: 'Open Sans', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        /* Base do corpo com gradiente sutil */
        body {
            margin: 0;
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffffff 0%, var(--background-blue) 100%);
            position: relative;
            overflow: hidden;
        }

        /* Fundo com rede de distribuição sutil (simulado com SVG) */
        .background-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48ZyBmaWxsPSJub25lIiBzdHJva2U9IiM5YzlhOWEiIHN0cm9rZS13aWR0aD0iMC4xIiBzdHJva2Utb3BhY2l0eT0iMC4yIj48cGF0aCBkPSJNMTAsMTBMMjAsMjBNMzAsMDBMNDAsMTBNODAsODBMOTAsOTBNMDAsNTBMMTAsNjBNNTAsNTBMMDYwLDYwTTIwLDgwTDMwLDkwTTgwLDIwTDkwLDMwIiAvPjxjaXJjbGUgY3g9IjIwIiBjeT0iMjAiIHI9IjAuNSIgLz48Y2lyY2xlIGN4PSI0MCIgY3k9IjEwIiByPSIwLjUiIC8+PGNpcmN5IGN4PSI5MCIgY3k9IjkwIiByPSIwLjUiIC8+PGNpcmN5IGN4PSIxMCIgY3k9IjYwIiByPSIwLjUiIC8+PGNpcmN5IGN4PSI2MCIgY3k9IjYwIiByPSIwLjUiIC8+PGNpcmN5IGN4PSIzMCIgY3k9IjkwIiByPSIwLjUiIC8+PGNpcmN5IGN4PSI5MCIgY3k9IjMwIiByPSIwLjUiIC8+PC9nPjwvc3ZnPg==');
            opacity: 0.15;
            z-index: 0;
        }

        /* Modal flutuante central */
        .modal {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            width: 400px;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        /* Título do Projeto */
        .project-title {
            font-size: 14px;
            color: var(--dark-blue);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 10px 0;
            font-weight: 500;
        }

        /* Logotipo do Caminhão (SVG limpo de linha) */
        .logo {
            width: 60px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Título da Ação */
        .login-title {
            font-size: 32px;
            color: var(--dark-blue);
            font-weight: 700;
            margin: 0 0 30px 0;
            letter-spacing: -1px;
        }

        /* Grupos de entrada com ícones */
        .input-group {
            position: relative;
            margin-bottom: 15px;
            width: 100%;
            max-width: 350px;
            margin-left: auto;
            margin-right: auto;
        }

        /* NOVO CAMPO CAD: Centralizado e mais compacto, como na inspiração */
        .input-group.cad-group {
            max-width: 250px;
            margin-top: 25px; /* Maior espaçamento abaixo do usuário */
        }

        /* Estilo dos Ícones dos Campos */
        .input-group svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--placeholder-gray);
        }

        /* Estilo dos Campos de Entrada */
        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border-radius: 30px;
            border: 1px solid var(--light-gray-border);
            font-size: 16px;
            color: #333;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        /* Efeito de foco sutil */
        .input-group input:focus {
            border-color: var(--dark-blue);
        }

        /* Cor do placeholder */
        .input-group input::placeholder {
            color: var(--placeholder-gray);
        }

        /* Botão "ENTRAR" */
        .enter-btn {
            background-color: var(--dark-blue);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            width: 100%;
            max-width: 350px;
            display: block;
            margin-left: auto; margin-right: auto;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s;
        }

        /* Efeito de hover no botão */
        .enter-btn:hover {
            background-color: #003666;
        }

        /* Controles externos (Ícone de configuração) */
        .config-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            cursor: pointer;
        }
        .config-icon svg { fill: var(--placeholder-gray); width: 24px; height: 24px; opacity: 0.8; }

        /* Controles externos (Controle inferior sutil) */
        .bottom-control {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        .bottom-control div {
            width: 15px; height: 15px; background: rgba(0,0,0,0.1); border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Padrão de fundo -->
    <div class="background-pattern"></div>
    
    <!-- Ícone de Configuração (Canto Superior Direito) -->
    <div class="config-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2a1 1 0 100 2a1 1 0 000-2zm0 3a1 1 0 110 2a1 1 0 010-2zm0 3a1 1 0 110 2a1 1 0 010-2zm0 3a1 1 0 110 2a1 1 0 010-2zm0 3a1 1 0 110 2a1 1 0 010-2z" stroke="#6b7280" stroke-width="0.5" fill="none" transform="rotate(45 12 12)" />
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.22-0.24-0.4-0.47-0.4h-3.84c-0.24,0-0.43,0.17-0.47,0.4L9.25,5.35C8.66,5.59,8.13,5.91,7.62,6.29L5.23,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.71,8.87c-0.12,0.21-0.07,0.47,0.12,0.61l2.03,1.58C4.82,11.36,4.8,11.68,4.8,12c0,0.32,0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.4,0.47,0.4h3.84c0.24,0,0.43-0.17,0.47-0.4l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.21,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
        </svg>
    </div>

    <!-- Modal de Login -->
    <div class="modal">
        <p class="project-title">EXPEDIÇÃO EM FLUXO</p>
        
        <!-- Logotipo do Caminhão (SVG de Linha Sutil) -->
        <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="var(--dark-blue)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 6h8v11H7zM15 7h4a2 2 0 0 1 2 2v7h-6v-9zM7 6l-3 3v8h3"></path>
                <circle cx="9" cy="18" r="2.5"></circle>
                <circle cx="17" cy="18" r="2.5"></circle>
                <path d="M0 10h6M-2 13h5M2 16h4M3 7h3" stroke-width="1" stroke-opacity="0.7"></path>
            </svg>
        </svg>
        
        <h1 class="login-title">LOGIN</h1>
        
        <form>
            <!-- CAMPO USUÁRIO -->
            <div class="input-group">
                <!-- Ícone de Pessoa (SVG limpo) -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <g fill="none" stroke="var(--placeholder-gray)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </g>
                </svg>
                <input type="text" placeholder="Usuário" required>
            </div>
            
            <!-- NOVO CAMPO CAD (abaixo do usuário, centralizado e mais compacto) -->
            <div class="input-group cad-group">
                <!-- Ícone de Armazém/CAD (SVG limpo) -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <g fill="none" stroke="var(--placeholder-gray)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 10V4.5a1.5 1.5 0 0 1 1.5-1.5h15a1.5 1.5 0 0 1 1.5 1.5V10c0 1.5-1.5 3-3 3h-12c-1.5 0-3-1.5-3-3z"></path>
                        <path d="M3 10c0-1.5 1.5-3 3-3h12c1.5 0 3 1.5 3 3"></path>
                        <path d="M6 13v7a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-7"></path>
                        <rect x="9" y="13" width="6" height="5" rx="1"></rect>
                    </g>
                </svg>
                <input type="text" placeholder="CAD" required>
            </div>
            
            <button type="submit" class="enter-btn">ENTRAR</button>
        </form>
    </div>
    
    <!-- Controle inferior sutil (Canto Inferior Direito) -->
    <div class="bottom-control">
        <div></div>
    </div>
</body>
</html>
