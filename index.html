<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expedição em Fluxo</title>
    <!-- Importando fonte e ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Variáveis de Cores */
        :root {
            --azul-escuro: #004b87; 
            --cinza-texto: #6b7280;
            --cinza-borda: #d1d5db;
            --fundo-tela: #eef1f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--fundo-tela); /* Fundo liso cinza claro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden; /* Esconde os caminhões fora da tela */
        }

        /* =========================================
           ANIMAÇÃO DOS 5 CAMINHÕES NO FUNDO
           ========================================= */
        .caminhao-fundo {
            position: absolute;
            font-size: 2.2rem;
            color: #cbd5e1; /* Cinza suave para os caminhões do fundo */
            opacity: 0.7;
            z-index: 1; 
        }

        /* Caminhões indo da Esquerda para a Direita */
        .cam-1 { top: 10%; animation: moveDireita 7s linear infinite; }
        .cam-3 { top: 40%; animation: moveDireita 9s linear infinite 2s; }
        .cam-5 { top: 85%; animation: moveDireita 5s linear infinite 1s; }

        /* Caminhões indo da Direita para a Esquerda */
        .cam-2 { top: 25%; animation: moveEsquerda 6s linear infinite; }
        .cam-4 { top: 70%; animation: moveEsquerda 8s linear infinite 3s; }

        @keyframes moveDireita {
            0% { left: -10%; transform: scaleX(1); }
            100% { left: 110%; transform: scaleX(1); }
        }

        @keyframes moveEsquerda {
            0% { right: -10%; transform: scaleX(-1); /* scaleX(-1) inverte a imagem do caminhão */ }
            100% { right: 110%; transform: scaleX(-1); }
        }

        /* =========================================
           CARTÃO DE LOGIN
           ========================================= */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            z-index: 2; /* Mantém o cartão na frente dos caminhões */
        }

        .cabecalho-logo p {
            font-size: 0.8rem;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* Estilo do Logo Customizado (SVG) */
        .logo-svg {
            width: 65px;
            height: 65px;
            margin-bottom: 10px;
            stroke: var(--azul-escuro);
        }

        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 30px;
        }

        /* Formulário e Inputs */
        .grupo-input {
            position: relative;
            margin-bottom: 15px;
        }

        .grupo-input i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--azul-escuro);
            font-size: 1.2rem;
        }

        .icone-esq { left: 15px; }
        .icone-dir { right: 15px; cursor: pointer; color: var(--cinza-texto) !important; }

        .grupo-input input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid var(--cinza-borda);
            border-radius: 30px;
            font-size: 0.95rem;
            color: #111827;
            outline: none;
            transition: border-color 0.3s;
        }

        .grupo-input input::placeholder {
            color: var(--cinza-texto);
        }

        .grupo-input input:focus {
            border-color: var(--azul-escuro);
        }

        /* Botão */
        .btn-entrar {
            width: 100%;
            background-color: var(--azul-escuro);
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-entrar:hover {
            background-color: #033663;
        }

        /* Rodapé */
        .rodape-login {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .rodape-login a {
            text-decoration: none;
            color: var(--cinza-texto);
        }

        .rodape-login a span {
            color: var(--azul-escuro);
            font-weight: 600;
        }

        .rodape-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 5 Caminhões animados no fundo -->
    <i class="ph ph-truck caminhao-fundo cam-1"></i>
    <i class="ph ph-truck caminhao-fundo cam-2"></i>
    <i class="ph ph-truck caminhao-fundo cam-3"></i>
    <i class="ph ph-truck caminhao-fundo cam-4"></i>
    <i class="ph ph-truck caminhao-fundo cam-5"></i>

    <!-- Card Principal -->
    <div class="login-card">
        <div class="cabecalho-logo">
            <p>Expedição em Fluxo</p>
            
            <!-- SVG Customizado: Caminhão com a Seta -->
            <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 6h8v11h-1"></path>
                <path d="M15 6h3.5L22 10v7h-6"></path>
                <circle cx="5" cy="17" r="2"></circle>
                <circle cx="18" cy="17" r="2"></circle>
                <path d="M-1 11h11"></path>
                <path d="M7 8l3 3-3 3"></path>
            </svg>

            <h1>LOGIN</h1>
        </div>

        <form>
            <div class="grupo-input">
                <i class="ph ph-user icone-esq"></i>
                <input type="text" placeholder="E-mail ou Usuário" required>
            </div>

            <div class="grupo-input">
                <i class="ph ph-lock-key icone-esq"></i>
                <input type="password" placeholder="Senha" required>
                <i class="ph ph-eye-slash icone-dir"></i>
            </div>

            <button type="submit" class="btn-entrar">ENTRAR</button>
        </form>

        <div class="rodape-login">
            <a href="#">Esqueceu a senha?</a>
            <a href="#">Ainda não tem conta? <span>Cadastre-se</span></a>
        </div>
    </div>

</body>
</html>
