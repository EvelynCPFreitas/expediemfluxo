<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedição em Fluxo</title>
    <!-- Importando fonte e ícones para consistência -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Estilo base adaptado para notebook (paisagem 16:9, legível) */
        html {
            font-size: 14px; /* Base para rem reduzida para notebook, mas legível */
        }
        body {
            background-color: #f4f7f6; /* Cinza claro suave profissional */
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Altura total da tela */
            overflow: hidden; /* Impede rolagem */
            /* Padrão de rede sutil no fundo */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill-rule='evenodd'%3E%3Cg fill='%23d1d5db' fill-opacity='0.1'%3E%3Cpath d='M10 10h10v10H10z'/%3E%3Cpath d='M10 10l80 80h10v10H90L10 20v-10z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* Contêiner principal do dashboard centralizado (modal) */
        #dashboard-container {
            display: grid;
            grid-template-rows: auto auto 1fr; /* Título, KPIs, Gráficos */
            grid-gap: 15px; /* Lacunas reduzidas */
            padding: 20px;
            width: 95vw; /* Usa quase toda a largura */
            max-width: 1400px; /* Largura máxima profissional */
            height: 95vh; /* Usa quase toda a altura */
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            box-sizing: border-box;
            position: relative;
            /* Padrão de rede sutil também no contêiner */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill-rule='evenodd'%3E%3Cg fill='%23d1d5db' fill-opacity='0.05'%3E%3Cpath d='M10 10h10v10H10z'/%3E%3Cpath d='M10 10l80 80h10v10H90L10 20v-10z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* Título e Logotipo */
        .header-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #004b87;
            text-transform: uppercase;
        }
        .header-group .icon-truck {
            font-size: 2.2rem;
            color: #b0bbcb;
            opacity: 0.7;
        }
        .header-group h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            padding-bottom: 5px;
        }

        /* Botão de troca de tema (Canto Superior Direito) */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0,0,0,0.05);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background-color 0.3s ease;
        }
        .theme-toggle-btn:hover {
            background-color: rgba(128, 128, 128, 0.2);
        }
        .theme-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #004b87;
            stroke-width: 1.5;
            transition: stroke 0.3s ease;
        }
        /* Exibir/Ocultar ícones com base no tema */
        #theme-icon-dark { display: none; }
        .dark-theme #theme-icon-light { display: none; }
        .dark-theme #theme-icon-dark { display: block; fill: #fcd34d; }

        /* Sidebar (Canto Esquerdo) */
        .sidebar {
            position: absolute;
            top: calc(50% - 150px); /* Centralizada verticalmente no modal */
            left: -30px; /* Avança um pouco para fora do modal */
            background-color: #dfe6e9; /* Cinza médio suave */
            width: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-radius: 15px;
            z-index: 10;
        }
        .sidebar i {
            font-size: 24px;
            margin-bottom: 25px;
            color: #004b87;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .sidebar i:hover {
            color: #1e88e5;
        }
        .sidebar-collapse-btn {
            margin-top: auto; /* Empurra para o rodapé da sidebar */
            margin-bottom: -10px;
            display: flex;
            gap: -8px; /* Setas sobrepostas */
        }
        .sidebar-collapse-btn i {
            font-size: 20px;
            color: #636e72;
        }

        /* Cards em geral */
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            padding: 10px; /* Preenchimento reduzido */
            color: #fff;
            box-sizing: border-box;
            background-size: cover;
            transition: box-shadow 0.3s ease;
        }

        /* Títulos de card */
        .card-title {
            font-size: 1rem;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        /* KPI Seção Superior (Lado a Lado) */
        .top-kpi-section {
            display: flex;
            gap: 15px; /* Lacunas reduzidas */
        }
        .kpi-card {
            flex-grow: 1;
            text-align: center;
            height: 120px; /* Altura reduzida */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .kpi-card h2 {
            margin-bottom: 5px;
        }
        .kpi-value {
            font-size: 3.5rem; /* Fonte reduzida, mas legível */
            font-weight: 700;
            display: block;
            margin-top: 10px;
        }
        .card-pendentes {
            background-image: linear-gradient(135deg, #b71c1c 0%, #f44336 100%);
        }
        .card-finalizados {
            background-image: linear-gradient(135deg, #000000 0%, #4caf50 100%);
        }

        /* Área de gráficos e ranking (Meio e inferior) */
        .charts-ranking-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* Três colunas de paisagem */
            grid-gap: 15px; /* Lacunas reduzidas */
        }

        /* Card Categorias */
        .categories-card {
            background-image: linear-gradient(135deg, #4527a0 0%, #9575cd 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 180px; /* Altura reduzida */
        }
        .category-legend {
            text-align: left;
            font-size: 0.8rem; /* Fonte reduzida */
            margin-top: -10px;
        }
        .category-legend p {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .legend-point {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .point-hu { background-color: #4dd0e1; }
        .point-desvio { background-color: #f06292; }
        .point-mu { background-color: #1e88e5; }
        .pie-chart {
            width: 80px; /* Tamanho reduzido */
            height: 80px; /* Tamanho reduzido */
            border-radius: 50%;
            background-image: conic-gradient(#4dd0e1 0% 50%, #f06292 50% 80%, #1e88e5 80% 100%);
            margin-right: 20px;
        }

        /* Card Ranking Resolution */
        .ranking-card {
            background-image: linear-gradient(135deg, #00838f 0%, #4dd0e1 100%);
            height: 180px; /* Altura reduzida */
        }
        .ranking-list {
            list-style: decimal inside;
            text-align: left;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 15px;
        }
        .ranking-list li {
            margin-bottom: 10px;
        }

        /* Card CAD'S Ofensores (Vertical à Direita) */
        .cad-card-vertical {
            background-image: linear-gradient(135deg, #4e342e 0%, #ff9800 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            grid-column: 3; /* Terceira coluna */
            grid-row: 1 / 3; /* Ocupa as linhas 1 e 2 */
            height: calc(180px * 2 + 15px); /* Altura de 2 cards + lacuna */
        }
        .bar-chart-vertical {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px; /* Lacunas reduzidas */
            padding: 20px;
            height: calc(100% - 30px); /* Altura restante do card */
        }
        .vertical-bar {
            width: 20px; /* Tamanho reduzido */
            background-color: #ffffff;
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
        }
        /* Alturas das barras simulando o gráfico da imagem */
        .bar-1 { height: 40%; }
        .bar-2 { height: 60%; }
        .bar-3 { height: 75%; }
        .bar-4 { height: 85%; }
        .bar-5 { height: 100%; }

        /* Gráfico Principal (Inferior com barras agrupadas) */
        .main-bar-chart-section {
            display: flex;
            background-color: #212121; /* Fundo escuro como na imagem */
            padding: 20px;
            border-radius: 12px;
            height: 350px; /* Altura principal */
            position: relative;
            grid-column: 1 / 3; /* Ocupa as colunas 1 e 2 */
        }
        /* Eixo Y */
        .y-axis {
            width: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #d1d5db;
            text-align: right;
            padding-right: 10px;
            font-weight: 600;
        }
        /* Contêiner Principal das Barras e Eixo X */
        .main-bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #4b5563;
            border-bottom: 1px solid #4b5563;
        }
        /* Área das Barras e Legenda */
        .bars-area {
            flex: 1;
            display: flex;
            justify-content: space-around;
            align-items: flex-end; /* Alinha barras na base */
            padding: 10px 0;
        }
        /* Legenda Superior do Gráfico */
        .chart-main-legend {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: #fff;
        }
        .chart-main-legend span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Contêiner de Barra Agrupada por Mês */
        .bar-group-month {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5px; /* Lacunas reduzidas */
            height: 100%;
        }
        .month-bar {
            width: 15px; /* Tamanho reduzido */
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
        }
        .bar-hu { background-color: #4dd0e1; }
        .bar-desvio { background-color: #f06292; }
        .bar-mu { background-color: #1e88e5; }

        /* Alturas simulando o gráfico principal */
        /* Jan */
        .jan .bar-hu { height: 50%; } .jan .bar-desvio { height: 35%; } .jan .bar-mu { height: 35%; }
        /* Fev */
        .fev .bar-hu { height: 45%; } .fev .bar-desvio { height: 28%; } .fev .bar-mu { height: 35%; }
        /* Mar */
        .mar .bar-hu { height: 35%; } .mar .bar-desvio { height: 20%; } .mar .bar-mu { height: 20%; }
        /* Abr */
        .abr .bar-hu { height: 28%; } .abr .bar-desvio { height: 50%; } .abr .bar-mu { height: 30%; }
        /* Mai */
        .mai .bar-hu { height: 48%; } .mai .bar-desvio { height: 18%; } .mai .bar-mu { height: 28%; }
        /* Jun */
        .jun .bar-hu { height: 20%; } .jun .bar-desvio { height: 30%; } .jun .bar-mu { height: 75%; }

        /* Eixo X */
        .x-axis {
            height: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 0.9rem;
            color: #d1d5db;
            font-weight: 600;
        }
        .month-label { flex: 1; text-align: center; }

        /* Estilos do Tema Escuro */
        .dark-theme {
            background-color: #0f172a;
            color: #d1d5db;
        }
        .dark-theme #dashboard-container {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .dark-theme .header-group {
            color: #1e88e5;
        }
        .dark-theme .theme-toggle-btn {
            background-color: rgba(255,255,255,0.1);
        }
        .dark-theme .theme-icon {
            stroke: #fcd34d;
        }
        .dark-theme .main-bar-chart-section {
            background-color: #1a1a1a;
        }

    </style>
</head>
<body>
    <div id="dashboard-container">
        <!-- Título e Logotipo -->
        <div class="header-group">
            <i class="ph ph-truck icon-truck"></i>
            <h1>DASHBOARD</h1>
        </div>

        <!-- Botão de troca de tema -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar tema">
            <!-- Ícone Tema Claro (Contorno) -->
            <svg id="theme-icon-light" class="theme-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2v2m0 16v2m-8-10H2m20 0h-2m-2.8-6.2L16.4 5.6m-8.8 8.8L5.6 16.4m11.2 0l1.4 1.4m-12.6-12.6l1.4 1.4M12 7a5 5 0 110 10 5 5 0 010-10z"></path>
                <path d="M12 9.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z" stroke-dasharray="1 3"></path>
            </svg>
            <!-- Ícone Tema Escuro (Preenchido) -->
            <svg id="theme-icon-dark" class="theme-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2v2m0 16v2m-8-10H2m20 0h-2m-2.8-6.2L16.4 5.6m-8.8 8.8L5.6 16.4m11.2 0l1.4 1.4m-12.6-12.6l1.4 1.4M12 7a5 5 0 110 10 5 5 0 010-10z"></path>
                <path d="M12 11.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"></path>
            </svg>
        </button>

        <!-- Sidebar (Canto Esquerdo) -->
        <aside class="sidebar">
            <i class="ph ph-squares-four"></i>
            <i class="ph ph-list-bullets"></i>
            <i class="ph ph-map-trifold"></i>
            <i class="ph ph-package"></i>
            <i class="ph ph-gear"></i>
            <div class="sidebar-collapse-btn">
                <i class="ph ph-arrow-right"></i>
                <i class="ph ph-arrow-right"></i>
            </div>
        </aside>

        <!-- KPI Seção Superior (Lado a Lado) -->
        <div class="top-kpi-section">
            <div class="card kpi-card card-pendentes">
                <h2 class="card-title">TOTAL PENDENTES</h2>
                <span class="kpi-value">30</span>
            </div>
            <div class="card kpi-card card-finalizados">
                <h2 class="card-title">TOTAL FINALIZADOS</h2>
                <span class="kpi-value">100</span>
            </div>
        </div>

        <!-- Área de gráficos e ranking (Meio e inferior) -->
        <div class="charts-ranking-section">
            <!-- Card Categorias -->
            <div class="card categories-card">
                <div class="category-info">
                    <h2 class="card-title">Categorias</h2>
                    <div class="category-legend">
                        <p><span class="legend-point point-hu"></span> HU Pendente</p>
                        <p><span class="legend-point point-desvio"></span> Desvio de Rota</p>
                        <p><span class="legend-point point-mu"></span> MU Pendente</p>
                    </div>
                </div>
                <div class="pie-chart"></div>
            </div>

            <!-- Card Ranking Resolution -->
            <div class="card ranking-card">
                <h2 class="card-title">Ranking Resolução</h2>
                <ol class="ranking-list">
                    <li></li>
                    <li></li>
                    <li></li>
                </ol>
            </div>

            <!-- Card CAD'S Ofensores (Vertical) -->
            <div class="card cad-card-vertical">
                <h2 class="card-title">CAD'S Ofensores</h2>
                <div class="bar-chart-vertical">
                    <div class="vertical-bar bar-1"></div>
                    <div class="vertical-bar bar-2"></div>
                    <div class="vertical-bar bar-3"></div>
                    <div class="vertical-bar bar-4"></div>
                    <div class="vertical-bar bar-5"></div>
                </div>
            </div>

            <!-- Gráfico Principal (Inferior com barras agrupadas) -->
            <div class="main-bar-chart-section">
                <!-- Legenda Superior Simulada -->
                <div class="chart-main-legend">
                    <span><span class="legend-point point-hu"></span> Hu Pendentes</span>
                    <span><span class="legend-point point-desvio"></span> Desvio de rota</span>
                    <span><span class="legend-point point-mu"></span> MU Pendentes</span>
                </div>
                <!-- Eixo Y Numerado -->
                <div class="y-axis">
                    <span>7.000</span>
                    <span>6.000</span>
                    <span>5.000</span>
                    <span>4.000</span>
                    <span>3.000</span>
                    <span>2.000</span>
                    <span>1.000</span>
                    <span>0</span>
                </div>
                <!-- Contêiner Principal das Barras e Eixo X -->
                <div class="main-bar-container">
                    <div class="bars-area">
                        <!-- Jan -->
                        <div class="bar-group-month jan">
                            <div class="month-bar bar-hu"></div>
                            <div class="month-bar bar-desvio"></div>
                            <div class="month-bar bar-mu"></div>
                        </div>
                        <!-- Fev -->
                        <div class="bar-group-month fev">
                            <div class="month-bar bar-hu"></div>
                            <div class="month-bar bar-desvio"></div>
                            <div class="month-bar bar-mu"></div>
                        </div>
                        <!-- Mar -->
                        <div class="bar-group-month mar">
                            <div class="month-bar bar-hu"></div>
                            <div class="month-bar bar-desvio"></div>
                            <div class="month-bar bar-mu"></div>
                        </div>
                        <!-- Abr -->
                        <div class="bar-group-month abr">
                            <div class="month-bar bar-hu"></div>
                            <div class="month-bar bar-desvio"></div>
                            <div class="month-bar bar-mu"></div>
                        </div>
                        <!-- Mai -->
                        <div class="bar-group-month mai">
                            <div class="month-bar bar-hu"></div>
                            <div class="month-bar bar-desvio"></div>
                            <div class="month-bar bar-mu"></div>
                        </div>
                        <!-- Jun -->
                        <div class="bar-group-month jun">
                            <div class="month-bar bar-hu"></div>
                            <div class="month-bar bar-desvio"></div>
                            <div class="month-bar bar-mu"></div>
                        </div>
                    </div>
                    <!-- Eixo X com Rótulos de Mês -->
                    <div class="x-axis">
                        <span class="month-label">Jan</span>
                        <span class="month-label">Fev</span>
                        <span class="month-label">Mar</span>
                        <span class="month-label">Abr</span>
                        <span class="month-label">Mai</span>
                        <span class="month-label">Jun</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Lógica do Tema (Salva a preferência no navegador)
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Verifica o tema salvo ou o padrão do sistema
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            body.classList.add(currentTheme);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            body.classList.add('dark-theme');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            let theme = 'light-theme';
            if (body.classList.contains('dark-theme')) {
                theme = 'dark-theme';
            }
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
</html>
