<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expedição em Fluxo</title>
    <!-- Importando fonte e ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Variáveis de Cores */
        :root {
            --azul-escuro: #004b87; 
            --cinza-texto: #6b7280;
            --cinza-borda: #d1d5db;
            --fundo-tela: #eef1f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--fundo-tela);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden; 
        }

        /* =========================================
           ANIMAÇÃO DOS 5 CAMINHÕES NO FUNDO
           ========================================= */
        .caminhao-fundo {
            position: absolute;
            font-size: 2.2rem;
            color: #cbd5e1; 
            opacity: 0.7;
            z-index: 1; 
        }

        .cam-1 { top: 10%; animation: moveDireita 7s linear infinite; }
        .cam-3 { top: 40%; animation: moveDireita 9s linear infinite 2s; }
        .cam-5 { top: 85%; animation: moveDireita 5s linear infinite 1s; }

        .cam-2 { top: 25%; animation: moveEsquerda 6s linear infinite; }
        .cam-4 { top: 70%; animation: moveEsquerda 8s linear infinite 3s; }

        @keyframes moveDireita {
            0% { left: -10%; transform: scaleX(1); }
            100% { left: 110%; transform: scaleX(1); }
        }

        @keyframes moveEsquerda {
            0% { right: -10%; transform: scaleX(-1); }
            100% { right: 110%; transform: scaleX(-1); }
        }

        /* =========================================
           CARTÃO DE LOGIN
           ========================================= */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            z-index: 2; 
        }

        .cabecalho-logo p {
            font-size: 0.8rem;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* Ajuste no tamanho do Logo SVG para acomodar os traços */
        .logo-svg {
            width: 95px;
            height: auto;
            margin-bottom: 10px;
        }

        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 30px;
        }

        /* Formulário e Inputs */
        .grupo-input {
            position: relative;
            margin-bottom: 15px;
        }

        .grupo-input i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--azul-escuro);
            font-size: 1.2rem;
        }

        .icone-esq { left: 15px; }
        .icone-dir { right: 15px; cursor: pointer; color: var(--cinza-texto) !important; }

        .grupo-input input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid var(--cinza-borda);
            border-radius: 30px;
            font-size: 0.95rem;
            color: #111827;
            outline: none;
            transition: border-color 0.3s;
        }

        .grupo-input input::placeholder {
            color: var(--cinza-texto);
        }

        .grupo-input input:focus {
            border-color: var(--azul-escuro);
        }

        /* Botão */
        .btn-entrar {
            width: 100%;
            background-color: var(--azul-escuro);
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-entrar:hover {
            background-color: #033663;
        }

        /* Rodapé */
        .rodape-login {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .rodape-login a {
            text-decoration: none;
            color: var(--cinza-texto);
        }

        .rodape-login a span {
            color: var(--azul-escuro);
            font-weight: 600;
        }

        .rodape-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 5 Caminhões animados no fundo -->
    <i class="ph ph-truck caminhao-fundo cam-1"></i>
    <i class="ph ph-truck caminhao-fundo cam-2"></i>
    <i class="ph ph-truck caminhao-fundo cam-3"></i>
    <i class="ph ph-truck caminhao-fundo cam-4"></i>
    <i class="ph ph-truck caminhao-fundo cam-5"></i>

    <!-- Card Principal -->
    <div class="login-card">
        <div class="cabecalho-logo">
            <p>Expedição em Fluxo</p>
            
            <!-- SVG Atualizado: Caminhão Sólido com a Seta Cortando -->
            <svg class="logo-svg" viewBox="0 0 100 65" xmlns="http://www.w3.org/2000/svg">
                <!-- Corpo e Cabine -->
                <path d="M28 12 C28 10 29.5 9 31 9 H68 C69.5 9 71 10 71 12 V18 H84 C85.5 18 87 19 87.5 20.5 L94.5 35.5 C94.8 36.5 95 37.5 95 38.5 V48 C95 50 93.5 51.5 91.5 51.5 H25 C22.8 51.5 21 49.7 21 47.5 V38 H28 V12 Z" fill="var(--azul-escuro)"/>
                
                <!-- Rodas (Azul com miolo branco para vazar) -->
                <circle cx="38" cy="52" r="7" fill="var(--azul-escuro)"/>
                <circle cx="38" cy="52" r="3" fill="#ffffff"/>
                
                <circle cx="78" cy="52" r="7" fill="var(--azul-escuro)"/>
                <circle cx="78" cy="52" r="3" fill="#ffffff"/>

                <!-- Janela da Cabine (Vazada em branco) -->
                <path d="M72 22 H81 L85 32 H72 V22 Z" fill="#ffffff"/>

                <!-- Seta cortando o caminhão (Vazada em branco) -->
                <path d="M21 24 H50 V16 L65 28.5 L50 41 V33 H21 V24 Z" fill="#ffffff"/>

                <!-- Tracinhos de velocidade (Linhas azuis atrás) -->
                <rect x="8" y="25" width="10" height="4" rx="1.5" fill="var(--azul-escuro)"/>
                <rect x="2" y="33" width="16" height="4" rx="1.5" fill="var(--azul-escuro)"/>
            </svg>

            <h1>LOGIN</h1>
        </div>

        <form>
            <div class="grupo-input">
                <i class="ph ph-user icone-esq"></i>
                <input type="text" placeholder="E-mail ou Usuário" required>
            </div>

            <div class="grupo-input">
                <i class="ph ph-lock-key icone-esq"></i>
                <input type="password" placeholder="Senha" required>
                <i class="ph ph-eye-slash icone-dir"></i>
            </div>

            <button type="submit" class="btn-entrar">ENTRAR</button>
        </form>

        <div class="rodape-login">
            <a href="#">Esqueceu a senha?</a>
            <a href="#">Ainda não tem conta? <span>Cadastre-se</span></a>
        </div>
    </div>

</body>
</html>
