<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Compacto</title>
    <style>
        /* Estilo base */
        html {
            font-size: 10px; /* Base para rem reduzida */
        }
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Altura total da tela */
            overflow: hidden; /* Impede rolagem */
        }

        /* Contêiner do dashboard */
        .dashboard-container {
            display: grid;
            grid-template-rows: auto auto 1fr;
            grid-gap: 0.6rem; /* Lacunas reduzidas */
            padding: 1.2rem;
            max-width: 100vw;
            max-height: 100vh;
            width: fit-content;
            height: fit-content;
            background-color: #fff;
            border-radius: 1.6rem;
            box-shadow: 0 0.4rem 1rem rgba(0,0,0,0.1);
        }

        /* Título */
        .dashboard-title {
            color: #004b8d;
            font-size: 1.6rem; /* Fonte reduzida */
            font-weight: bold;
            margin: 0;
            padding-bottom: 0.4rem;
        }

        /* Cards em geral */
        .card {
            border-radius: 1.2rem;
            padding: 0.8rem; /* Preenchimento reduzido */
            color: #fff;
            position: relative;
            box-sizing: border-box;
            background-size: cover;
            overflow: hidden;
        }

        /* Detalhes esquemáticos de metal nos cantos */
        .card::before,
        .card::after {
            content: '';
            position: absolute;
            width: 0.6rem;
            height: 0.6rem;
            background-color: #f5f5f5; /* Cor de fundo para simular metal */
            border-radius: 50%;
            border: 0.1rem solid #ccc;
        }
        .card::before { top: 0.4rem; left: 0.4rem; }
        .card::after { bottom: 0.4rem; right: 0.4rem; }
        .card.alternate::before { top: 0.4rem; right: 0.4rem; }
        .card.alternate::after { bottom: 0.4rem; left: 0.4rem; }

        /* Títulos de card */
        .card-title {
            font-size: 0.8rem; /* Fonte reduzida */
            text-transform: uppercase;
            margin: 0;
            opacity: 0.9;
        }

        /* Linhas de cards */
        .row {
            display: flex;
            gap: 0.6rem; /* Lacunas reduzidas */
        }

        /* Fileira KPI (Superior) */
        .top-kpi .card {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 6rem; /* Altura reduzida */
        }
        .top-kpi .card-title {
            margin-bottom: 0.2rem;
        }
        .kpi-value {
            font-size: 2.2rem; /* Fonte reduzida */
            font-weight: bold;
            margin: 0;
        }
        .top-kpi .card-left {
            background-image: linear-gradient(135deg, #f05040, #ff8070);
        }
        .top-kpi .card-right {
            background-image: linear-gradient(135deg, #106030, #209040);
        }

        /* Área de gráficos e ranking (Meio e inferior) */
        .charts-ranking {
            display: flex;
            gap: 0.6rem; /* Lacunas reduzidas */
        }
        .charts-left {
            display: flex;
            flex-direction: column;
            gap: 0.6rem; /* Lacunas reduzidas */
            flex-basis: 60%;
        }
        .charts-right {
            flex-basis: 40%;
            display: flex;
        }

        /* Card Categorias */
        .card-categories {
            background-image: linear-gradient(135deg, #9050c0, #704090);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 9rem; /* Altura reduzida */
        }
        .category-legend {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.65rem; /* Fonte reduzida */
        }
        .category-legend li {
            display: flex;
            align-items: center;
            margin-bottom: 0.2rem;
        }
        .legend-dot {
            width: 0.7rem;
            height: 0.7rem;
            border-radius: 50%;
            margin-right: 0.3rem;
            border: 0.1rem solid rgba(0,0,0,0.1);
        }
        .dot-hu { background-color: #a0c0e0; }
        .dot-desvio { background-color: #e090a0; }
        .dot-mu { background-color: #60c0e0; }
        .pie-chart {
            width: 4rem; /* Tamanho reduzido */
            height: 4rem; /* Tamanho reduzido */
            background-image: conic-gradient(
                #a0c0e0 0% 40%,
                #e090a0 40% 70%,
                #60c0e0 70% 100%
            );
            border-radius: 50%;
            border: 0.15rem solid rgba(255,255,255,0.4);
            box-shadow: 0 0 0.3rem rgba(0,0,0,0.1);
        }

        /* Card Ranking Resolution */
        .card-ranking {
            background-image: linear-gradient(135deg, #40c0d0, #60e0f0);
            height: 7rem; /* Altura reduzida */
        }
        .ranking-list {
            list-style: decimal;
            font-size: 0.8rem; /* Fonte reduzida */
            margin: 0;
            padding-left: 1.2rem;
            opacity: 0.95;
        }
        .ranking-list li {
            margin-bottom: 0.1rem;
        }

        /* Card CAD'S Ofensores */
        .card-ofensores {
            background-image: linear-gradient(135deg, #a06030, #e09040);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100%;
        }
        .bar-chart-vertical {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            gap: 0.3rem; /* Lacunas reduzidas */
            margin-top: auto; /* Empurra para a base */
            margin-bottom: 0.2rem;
            width: 100%;
        }
        .vertical-bar {
            width: 1.8rem; /* Tamanho reduzido */
            background-color: #fff;
            border-radius: 0.3rem;
            transition: height 0.3s ease;
        }
        /* Alturas das barras simuladas */
        .bar-1 { height: 2.2rem; }
        .bar-2 { height: 3.2rem; }
        .bar-3 { height: 4.2rem; }
        .bar-4 { height: 5.2rem; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Título -->
        <h1 class="dashboard-title">DASHBOARD</h1>

        <!-- Fileira KPI (Superior) -->
        <div class="row top-kpi">
            <div class="card card-left">
                <h2 class="card-title">TOTAL PENDENTES</h2>
                <p class="kpi-value">30</p>
            </div>
            <div class="card card-right alternate">
                <h2 class="card-title">TOTAL FINALIZADOS</h2>
                <p class="kpi-value">100</p>
            </div>
        </div>

        <!-- Área de gráficos e ranking -->
        <div class="charts-ranking">
            <!-- Coluna Esquerda -->
            <div class="charts-left">
                <div class="card card-categories">
                    <div>
                        <h2 class="card-title">CATEGORIAS</h2>
                        <ul class="category-legend">
                            <li><span class="legend-dot dot-hu"></span> HU Pendente</li>
                            <li><span class="legend-dot dot-desvio"></span> Desvio de Rota</li>
                            <li><span class="legend-dot dot-mu"></span> MU Pendente</li>
                        </ul>
                    </div>
                    <div class="pie-chart"></div>
                </div>
                <div class="card card-ranking alternate">
                    <h2 class="card-title">RANKING RESOLUÇÃO</h2>
                    <ol class="ranking-list">
                        <li></li>
                        <li></li>
                        <li></li>
                    </ol>
                </div>
            </div>
            <!-- Coluna Direita -->
            <div class="charts-right">
                <div class="card card-ofensores">
                    <h2 class="card-title">CAD'S OFENSORES</h2>
                    <div class="bar-chart-vertical">
                        <div class="vertical-bar bar-1"></div>
                        <div class="vertical-bar bar-2"></div>
                        <div class="vertical-bar bar-3"></div>
                        <div class="vertical-bar bar-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
