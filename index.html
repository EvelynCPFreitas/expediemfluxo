<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expedição em Fluxo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --azul-escuro: #004b87;
            --cinza-texto: #6b7280;
            --cinza-borda: #d1d5db;
            --fundo-tela: #eef1f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--fundo-tela);
            /* Lembre-se de colocar o nome do seu arquivo de fundo aqui */
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* =========================================
           ANIMAÇÃO DOS CAMINHÕES NAS CURVAS
           ========================================= */
        .caminhao-fundo {
            position: absolute;
            font-size: 2.2rem;
            color: #b0bbcb;
            opacity: 0.8; /* Aumentei um pouco a opacidade para destacar */
            z-index: 1;
            
            /* Esta propriedade faz o ícone girar acompanhando a curva */
            offset-rotate: auto; 
        }

        /* Trilho 1: Curva da esquerda para cima */
        .caminhao-1 { 
            offset-path: path('M -50,200 C 200,200 250,50 300,-50');
            animation: seguirTrilha 15s linear infinite;
        }

        /* Trilho 2: Curva longa da parte inferior esquerda para a direita */
        .caminhao-2 { 
            offset-path: path('M -50,600 C 300,600 400,350 1200,350');
            animation: seguirTrilha 20s linear infinite;
            animation-delay: 3s; /* Começa depois de 3 segundos */
        }

        /* Trilho 3: Curva da direita para baixo (sentido oposto) */
        .caminhao-3 { 
            offset-path: path('M 1200,150 C 900,150 800,500 500,800');
            animation: seguirTrilha 18s linear infinite;
            /* offset-rotate: auto 180deg (para o caminhão não andar de ré) */
            offset-rotate: auto 180deg;
        }

        /* Animação universal que manda o elemento do início ao fim do trilho */
        @keyframes seguirTrilha {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        /* =========================================
           CARTÃO DE LOGIN (Mantido)
           ========================================= */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            z-index: 2;
        }

        .cabecalho-logo p {
            font-size: 0.8rem;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .logo-svg {
            width: 65px;
            height: 65px;
            margin-bottom: 10px;
            stroke: var(--azul-escuro);
        }

        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 30px;
        }

        .grupo-input {
            position: relative;
            margin-bottom: 15px;
        }

        .grupo-input i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--azul-escuro);
            font-size: 1.2rem;
        }

        .icone-esq { left: 15px; }
        .icone-dir { right: 15px; cursor: pointer; color: var(--cinza-texto) !important; }

        .grupo-input input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid var(--cinza-borda);
            border-radius: 30px;
            font-size: 0.95rem;
            color: #111827;
            outline: none;
            transition: border-color 0.3s;
        }

        .grupo-input input::placeholder {
            color: var(--cinza-texto);
        }

        .grupo-input input:focus {
            border-color: var(--azul-escuro);
        }

        .btn-entrar {
            width: 100%;
            background-color: var(--azul-escuro);
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-entrar:hover {
            background-color: #033663;
        }

        .rodape-login {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .rodape-login a {
            text-decoration: none;
            color: var(--cinza-texto);
        }
